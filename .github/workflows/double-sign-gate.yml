name: Double-Sign Gate (§32.2 / 铁律 #13)

# 铁律 #13 的**可执行**部分。以前"forbidden 路径要打 requires-double-review 标签"只写在文档里，
# CI 从不校验；现在 PR 触及 forbidden 路径而未打标 → exit 1，配合 branch protection 的
# required status check 真阻断 merge。
#
# 来源：v4.7（GitLab 线）在 .gitlab-ci.yml 里造的 `double-sign-gate` job。v4.9 GitHub 解封回迁
# 时把这份能力搬回主平台；GitLab 侧的同名 job 保留（镜像平台，见 §51）。
#
# 为什么独立成 workflow 而不塞进 eval.yml：
#   eval.yml 有 `paths:` 过滤（只在 config surface 变动时跑），一个只碰 src/auth/** 的 PR
#   **不会**触发它 → 标签检查永远不生效（GitLab 侧二审发现的同一个残余缺口）。
#   故本 workflow 对**每个 pull_request 都跑、无 paths 过滤**。
#
# 零 token：标签从 PR 事件载荷 `github.event.pull_request.labels.*.name` 读，不调 API。
# 注：llm-judge 会在命中时自动补打该标签，但补标不会重跑当前 workflow —— 补标后的下一次
# push / 手动 re-run 才会通过，这是刻意的人审停顿点。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  double-sign-gate:
    name: Forbidden 路径双签标签检查
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 比对改动文件与 forbidden SSOT
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -u

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "非 pull_request 事件（无 base/head sha）— 跳过双签标签检查。"
            exit 0
          fi

          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=200 origin "$BASE_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=200 origin "$HEAD_SHA"

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          # forbidden 正则单源读 SSOT（同 llm-judge / forbidden-guard.sh / .gitlab-ci.yml）。
          # CRLF 兜底：\r 混进正则会导致永远测不出 forbidden 路径（静默失效，最危险的一类 bug）。
          if [ -f scripts/forbidden-paths.txt ]; then
            forbidden_regex="$(
              tr -d '\r' < scripts/forbidden-paths.txt |
                sed -E 's/[[:space:]]*#.*$//' |
                sed -E '/^[[:space:]]*$/d' |
                paste -sd'|' -
            )"
          else
            forbidden_regex='auth/|payment/|billing/|secrets/|keys/|migration|crypto/|infra/|terraform/|ansible/|\.github/workflows/|\.gitlab-ci\.yml|\.gitlab/'
          fi

          touched="$(printf '%s\n' "$changed_files" | grep -E "$forbidden_regex" || true)"
          if [ -z "$touched" ]; then
            echo "本 PR 未触及 §32.1 forbidden 路径 — 双签标签非必需。"
            exit 0
          fi

          echo "本 PR 触及 §32.1 forbidden 路径："
          printf '%s\n' "$touched" | sed 's/^/  /'

          case ",${PR_LABELS:-}," in
            *,requires-double-review,*)
              echo "已打 requires-double-review 标签 — 双签流程已启动，继续。"
              ;;
            *)
              echo "::error::forbidden 路径改动需先打 requires-double-review 标签（手册 §32.2 双签 / 铁律 #13）"
              exit 1
              ;;
          esac
