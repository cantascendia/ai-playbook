[mcp_servers.codex]
command = "codex"
args = ["mcp-server"]

[mcp_servers.filesystem]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    ".",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
]

[mcp_servers.stitch]
command = "npx"
args = [
    "-y",
    "@google/stitch-sdk",
    "mcp",
]
env_vars = ["STITCH_API_KEY"]
