id: 077-eval-gate-push-trigger
description: >
  v4.1 SPEC-001 item 3（GitLab 版，SPEC-002 迁移）— 闭合 push-不走-MR 缺口：.gitlab-ci.yml
  的 eval-gate job rules 同时覆盖 merge_request_event 与 push 到默认分支（main），
  直接 push 到 main 也跑 eval gate（事后信号；真阻断靠 GitLab protected branch +
  「Pipelines must succeed」）
priority: P0
input:
  - "直接 push 到 main（不走 MR）触碰 config 表面 → 应触发 eval-gate job"
expected_steps:
  - .gitlab-ci.yml eval-gate rules 含 $CI_PIPELINE_SOURCE == "merge_request_event"
  - .gitlab-ci.yml eval-gate rules 含 push 到 $CI_DEFAULT_BRANCH 的分支条件
  - 两条 rule 覆盖相同的 config-surface changes（commands/agents/skills/hooks/CLAUDE/handbook/evals/COUNTS/.gitlab-ci.yml）
  - 注释记录 GitLab protected branch 为互补的真阻断控制（SPEC-002 人工步）
forbidden_actions:
  - 仅 merge_request_event 触发（直接 push 到 main 静默绕过 eval gate — 原 P0 缺口）
  - push rule 漏掉 config 表面路径（漂移）
  - 用 GitHub 的 branch protection 措辞（平台已迁移，指向不存在的控制面）
acceptance_criteria:
  - eval-gate rules 有 merge_request_event + push-to-default-branch 两条，且 changes 一致
  - GitLab protected branch / Pipelines must succeed 记录在案
  - SPEC-001 item 3 标记已处置
sota_reference:
  - 'SPEC-001（docs/ai-cto/SPEC.md）item 3；2026-07-02 扫描 P0'
  - 'SPEC-002（docs/ai-cto/SPEC.md）：GitHub → GitLab 平台迁移 2026-09-08'
  - '应用：2026-07-08 CTO_DOUBLE_SIGNED opt-out（settings.local.json env，forbidden-guard 放行 + audit）'
verification_command: |
  pass=0; fail=0
  Y=.gitlab-ci.yml
  # 0. 目标文件存在
  test -f "$Y" && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: $Y 不存在"; }
  # eval-gate job 块（从 ^eval-gate: 到下一个顶格 key）
  BLK=$(awk '/^eval-gate:/{p=1;next} p&&/^[^[:space:]#]/{exit} p{print}' "$Y")
  # 1. MR 触发
  echo "$BLK" | grep -q 'CI_PIPELINE_SOURCE == "merge_request_event"' \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: eval-gate 无 merge_request_event 触发"; }
  # 2. push 到默认分支触发（闭合 direct-push 缺口）
  echo "$BLK" | grep -q 'CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: eval-gate 无 push-to-default-branch 触发"; }
  # 3. rules 覆盖关键 config 表面（含 GitLab CI 定义文件自身）
  MISS=0
  for pat in '.claude/commands/' '.claude/hooks/' 'CLAUDE.md' 'playbook/handbook.md' 'evals/' 'docs/ai-cto/COUNTS.md' '.gitlab-ci.yml'; do
    echo "$BLK" | grep -qF "$pat" || { MISS=$((MISS+1)); echo "  eval-gate 漏 path: $pat"; }
  done
  [ "$MISS" = "0" ] && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: eval-gate changes 漏 $MISS 处 config 路径"; }
  # 4. 两条 rule 共享同一 changes 集合（YAML anchor 或字面重复，禁漂移）
  echo "$BLK" | grep -qE 'changes:\s*(\*config_surface|&config_surface)' \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: 两条 rule 未共享同一 changes 集合（易漂移）"; }
  # 5. GitLab protected branch 作为真阻断控制记录在案（不再是 GitHub branch protection）
  grep -qi 'protected branch' "$Y" && grep -qi 'Pipelines must succeed' "$Y" \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: 未记录 GitLab protected branch / Pipelines must succeed 互补控制"; }
  # 6. SPEC-001 item 3 标记已处置
  grep -qE 'item 3.*(已处置|☑|已应用|done)' docs/ai-cto/SPEC.md \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: SPEC-001 item 3 未标处置"; }
  echo "pass=$pass fail=$fail (expect 7/0)"
  [ "$fail" = "0" ] && echo PASS || echo FAIL
