id: 079-self-audit-rolling-issue
description: >
  v4.2 PR#11（GitLab 版，SPEC-002 迁移）— .gitlab-ci.yml 的 self-audit-weekly job 写 Issue
  的步骤必须是滚动单 issue：先经 GitLab Issues API 查带 self-audit-rolling 标签的 opened
  issue，存在则原地 PUT 更新标题（含最新日期）+ description（最新报告）+ 刷新评论，
  否则 POST 新建；并对其余仍 opened 的 self-audit issue 评论 superseded 后
  state_event=close，消除每周堆积噪声。触发改为 GitLab pipeline schedule
  （$CI_PIPELINE_SOURCE == "schedule"），报告作为 artifact（CI 从不 commit 回仓库）。
priority: P1
input:
  - "pipeline schedule 生成 SELF-AUDIT 报告后，写 issue 步骤运行"
expected_steps:
  - "job self-audit-weekly rules 含 $CI_PIPELINE_SOURCE == \"schedule\"（web 手动为可选补充）"
  - "curl GET issues?state=opened&labels=self-audit-rolling 查是否已有滚动 issue"
  - "存在 → curl PUT 更新 title(含最新日期)+description(最新报告) + POST notes 'audit refreshed <date>'"
  - "不存在 → curl POST 新建，labels=self-audit,self-audit-rolling,v3.9-flywheel，记录其 iid"
  - "curl GET issues?state=opened&labels=self-audit，对 iid≠滚动号者 POST notes 'superseded by rolling issue #<N>' + PUT state_event=close"
  - "无 GITLAB_TOKEN 时优雅跳过（报告仍作为 artifact 保留），不硬失败也不假绿"
  - "健康指标 step / 报告生成逻辑逐字移植，仅把 $GITHUB_OUTPUT 换成普通 shell 变量"
forbidden_actions:
  - "保留无条件新建 issue（每周堆积一个新 issue — 本次修复的根因）"
  - "关闭 issue 时误关滚动 issue 自身（iid 相等必须跳过）"
  - "在 CI 里用 gh CLI / actions/github-script（GitHub 账号已封禁）"
  - "在 CI 里 git commit / push 报告回仓库（应走 artifacts）"
  - "缺 GITLAB_TOKEN 时硬失败或静默假绿"
acceptance_criteria:
  - ".gitlab-ci.yml 存在 self-audit-weekly job，可经 GITLAB_CI_PATH 参数化验证"
  - "job 含 schedule 触发 + Issues API 调用 + self-audit-rolling 标签 + state_event=close + superseded 文案"
  - "新建 issue 的 POST 恰好出现 1 次，且落在 if/else 的 else 分支内（rollingIid 为判别标记 → 条件新建非无条件）"
  - "报告经 artifacts 暴露，CI 不 commit 回仓库"
  - "verification_command 输出真实 pass=N fail=N，末行 PASS 或 FAIL"
verification_command: |
  TARGET="${GITLAB_CI_PATH:-.gitlab-ci.yml}"
  pass=0; fail=0
  ok()  { pass=$((pass+1)); }
  bad() { fail=$((fail+1)); echo "FAIL: $1"; }

  test -f "$TARGET" && ok || bad "target 不存在: $TARGET"
  # self-audit-weekly job 块：^self-audit-weekly: 到下一个顶格 key
  JOB=$(awk '/^self-audit-weekly:/{p=1;next} p&&/^[^[:space:]#]/{exit} p{print}' "$TARGET")

  printf '%s\n' "$JOB" | grep -q 'CI_PIPELINE_SOURCE == "schedule"' \
    && ok || bad "缺 schedule 触发（$CI_PIPELINE_SOURCE == schedule）"
  printf '%s\n' "$JOB" | grep -q 'projects/${CI_PROJECT_ID}/issues' \
    && ok || bad "缺 GitLab Issues API 调用"
  printf '%s\n' "$JOB" | grep -q 'labels=self-audit-rolling' \
    && ok || bad "缺按 self-audit-rolling 标签查已有 issue"
  printf '%s\n' "$JOB" | grep -q 'labels=self-audit,self-audit-rolling,v3.9-flywheel' \
    && ok || bad "缺三标签（self-audit / self-audit-rolling / v3.9-flywheel）"
  printf '%s\n' "$JOB" | grep -q -- '--request PUT' \
    && ok || bad "缺 PUT（未原地更新滚动 issue）"
  printf '%s\n' "$JOB" | grep -q 'state_event=close' \
    && ok || bad "缺 state_event=close（未关闭旧 issue）"
  printf '%s\n' "$JOB" | grep -q 'superseded by rolling issue' \
    && ok || bad "缺 superseded 文案"
  printf '%s\n' "$JOB" | grep -q 'audit refreshed' \
    && ok || bad "缺 audit refreshed 刷新评论"
  printf '%s\n' "$JOB" | grep -q 'rollingIid' \
    && ok || bad "缺 rollingIid 判别变量"
  printf '%s\n' "$JOB" | grep -q 'else' \
    && ok || bad "缺 if/else 条件分支"
  # 新建 issue 的 POST 恰好 1 次（以三标签 payload 为唯一标识）
  CNT=$(printf '%s\n' "$JOB" | grep -c 'labels=self-audit,self-audit-rolling,v3.9-flywheel')
  [ "$CNT" = "1" ] && ok || bad "新建 issue 次数=$CNT≠1"
  # 新建落在 else 分支内 → 条件新建而非顶层无条件
  printf '%s\n' "$JOB" | awk '/^ *else$/{e=1} e && /labels=self-audit,self-audit-rolling,v3.9-flywheel/{f=1} END{exit f?0:1}' \
    && ok || bad "新建不在 else 分支内（疑似无条件 create）"
  # 不误关滚动 issue 自身
  printf '%s\n' "$JOB" | grep -q '\[ "$iid" != "$rollingIid" \]' \
    && ok || bad "关闭循环未跳过滚动 issue 自身"
  # 无 token 优雅跳过
  printf '%s\n' "$JOB" | grep -q 'GITLAB_TOKEN not set' \
    && ok || bad "无 GITLAB_TOKEN 时未优雅跳过"
  # 报告走 artifacts，CI 不 commit 回仓库
  printf '%s\n' "$JOB" | grep -q 'SELF-AUDIT-\*\.md' \
    && ok || bad "SELF-AUDIT 报告未作为 artifact 暴露"
  printf '%s\n' "$JOB" | grep -qE 'git (commit|push)' \
    && bad "CI 内 commit/push 回仓库（应走 artifacts）" || ok
  # 健康指标 step 逐字移植（4 个指标 + 无 GITHUB_OUTPUT 残留）
  printf '%s\n' "$JOB" | grep -q 'TRAJ_COUNT' && printf '%s\n' "$JOB" | grep -q 'REVIEW_COUNT' \
    && printf '%s\n' "$JOB" | grep -q 'BLOCK_COUNT' && printf '%s\n' "$JOB" | grep -q 'LEARNED' \
    && ok || bad "健康指标 4 项不全"
  printf '%s\n' "$JOB" | grep -q 'GITHUB_OUTPUT' \
    && bad "残留 GITHUB_OUTPUT（GitHub Actions 专有）" || ok
  echo "pass=$pass fail=$fail"
  [ "$fail" = "0" ] && echo PASS || echo FAIL
