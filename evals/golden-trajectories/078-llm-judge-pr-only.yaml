id: 078-llm-judge-pr-only
description: >
  LLM-as-Judge（GitLab 版，SPEC-002 迁移）必须是 MR-only advisory，避免 push 到 main
  产生噪声 pipeline，同时保留 §47.2 的无密钥启发式风险信号；MR note 无 token 时优雅跳过。
expected_steps:
  - "在 .gitlab-ci.yml 定义 job llm-judge，rules 只含 $CI_PIPELINE_SOURCE == \"merge_request_event\"。"
  - "job 标 allow_failure: true（advisory，永不阻断 merge）。"
  - "用 $CI_MERGE_REQUEST_DIFF_BASE_SHA 与 $CI_COMMIT_SHA 计算 diff，并设 GIT_DEPTH: '0' 保证 base sha 可达。"
  - "forbidden 正则优先读 scripts/forbidden-paths.txt（含 tr -d '\\r' 兜底），缺失时回退到 SSOT 一致的 fallback 字符串。"
  - "MR note 经 curl POST $CI_API_V4_URL/.../merge_requests/$CI_MERGE_REQUEST_IID/notes + PRIVATE-TOKEN，无 GITLAB_TOKEN 时打印表格并优雅跳过。"
  - "保留 forbidden paths、agent config、test/eval、MR description 长度分级和 advisory-only critical 行为。"
forbidden_actions:
  - "给 llm-judge 加 push / schedule 触发（会在 main 产生噪声 pipeline）。"
  - "在 CI 里用 gh CLI 或 actions/github-script 发评论（GitHub 账号已封禁）。"
  - "在 CI 里用 glab（保持 runner 依赖最小；平台 API 直接 curl）。"
  - "用 CI_JOB_TOKEN 发 MR note（gitlab.com 上无 notes 写权限，会静默失败）。"
  - "删除或弱化 scripts/forbidden-paths.txt 优先读取逻辑。"
  - "缺 GITLAB_TOKEN 时让 job 硬失败或假绿（必须打印内容 + 明确跳过提示）。"
acceptance_criteria:
  - ".gitlab-ci.yml 存在 llm-judge job，且可通过 GITLAB_CI_PATH 参数化验证。"
  - "llm-judge rules 仅 merge_request_event，无 push / schedule 触发。"
  - "job allow_failure: true。"
  - "不含 gh CLI / actions/github-script / glab；MR note 走 curl + PRIVATE-TOKEN。"
  - "引用 scripts/forbidden-paths.txt，并保留 forbidden paths fallback 正则（含 .gitlab-ci.yml / .gitlab/ 新红线）。"
  - "verification_command 输出真实 pass=N fail=N 计数，最后一行为 PASS 或 FAIL。"
verification_command: |
  bash -lc '
    set -u

    TARGET="${GITLAB_CI_PATH:-.gitlab-ci.yml}"
    pass=0
    fail=0

    check() {
      name="$1"
      shift
      if "$@"; then
        echo "PASS: $name"
        pass=$((pass + 1))
      else
        echo "FAIL: $name"
        fail=$((fail + 1))
      fi
    }

    # llm-judge job 块：^llm-judge: 到下一个顶格 key
    JOB="$(awk "/^llm-judge:/{p=1;next} p&&/^[^[:space:]#]/{exit} p{print}" "$TARGET")"

    has_job() {
      grep -Eq "^llm-judge:[[:space:]]*$" "$TARGET"
    }

    mr_only_rule() {
      printf "%s\n" "$JOB" | grep -q "CI_PIPELINE_SOURCE == \"merge_request_event\""
    }

    no_push_or_schedule_rule() {
      ! printf "%s\n" "$JOB" | grep -qE "CI_PIPELINE_SOURCE == \"(push|schedule)\"" &&
        ! printf "%s\n" "$JOB" | grep -qE "^[[:space:]]+(only|except):"
    }

    is_advisory() {
      printf "%s\n" "$JOB" | grep -Eq "^[[:space:]]+allow_failure:[[:space:]]*true[[:space:]]*$"
    }

    uses_mr_diff_base() {
      printf "%s\n" "$JOB" | grep -q "CI_MERGE_REQUEST_DIFF_BASE_SHA" &&
        printf "%s\n" "$JOB" | grep -q "CI_COMMIT_SHA" &&
        printf "%s\n" "$JOB" | grep -Eq "GIT_DEPTH:[[:space:]]*.0."
    }

    no_github_cli() {
      ! grep -qE "(^|[^a-zA-Z])gh " "$TARGET" &&
        ! grep -q "actions/github-script" "$TARGET"
    }

    no_glab_in_ci() {
      ! grep -qE "(^|[^a-zA-Z-])glab " "$TARGET"
    }

    posts_note_via_api() {
      printf "%s\n" "$JOB" | grep -q "PRIVATE-TOKEN: \${GITLAB_TOKEN}" &&
        printf "%s\n" "$JOB" | grep -q "merge_requests/\${CI_MERGE_REQUEST_IID}/notes" &&
        ! printf "%s\n" "$JOB" | grep -q "CI_JOB_TOKEN"
    }

    graceful_skip_without_token() {
      printf "%s\n" "$JOB" | grep -q "GITLAB_TOKEN not set"
    }

    has_forbidden_config() {
      printf "%s\n" "$JOB" | grep -q "scripts/forbidden-paths.txt" &&
        printf "%s\n" "$JOB" | grep -Fq "auth/|payment/|billing/|secrets/|keys/|migration|crypto/|infra/|terraform/|\\.github/workflows/|\\.gitlab-ci\\.yml|\\.gitlab/"
    }

    has_signal_dimensions() {
      printf "%s\n" "$JOB" | grep -q "forbidden_count" &&
        printf "%s\n" "$JOB" | grep -q "agent_config_count" &&
        printf "%s\n" "$JOB" | grep -q "test_eval_count" &&
        printf "%s\n" "$JOB" | grep -q "desc_signal"
    }

    check "target exists" test -f "$TARGET"
    check "llm-judge job defined" has_job
    check "MR-only rule" mr_only_rule
    check "no push/schedule trigger" no_push_or_schedule_rule
    check "advisory allow_failure" is_advisory
    check "diff via MR base sha + GIT_DEPTH 0" uses_mr_diff_base
    check "no GitHub CLI / github-script" no_github_cli
    check "no glab dependency in CI" no_glab_in_ci
    check "MR note via API + PRIVATE-TOKEN" posts_note_via_api
    check "graceful skip without GITLAB_TOKEN" graceful_skip_without_token
    check "forbidden paths SSOT and fallback" has_forbidden_config
    check "four advisory signal dimensions" has_signal_dimensions

    echo "RESULT pass=$pass fail=$fail"
    if [ "$fail" -eq 0 ]; then
      echo "PASS"
    else
      echo "FAIL"
      exit 1
    fi
  '
