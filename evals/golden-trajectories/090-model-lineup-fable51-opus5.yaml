id: 090-model-lineup-fable51-opus5
description: >-
  Claude 模型阵容 SSOT（铁律 #3）—— 手册 §1.2 必须同时登记 `claude-fable-5-1`
  （Mythos-class，Opus 之上最强通用推理，与 Claude Mythos 5.1 同底模型，Fable 变体含额外
  双用途安全措施）与 `claude-opus-5`，两者定位各自明确，且上一代（Opus 4.8 / Fable 5）
  保留在表内不删行（053 回归 + 成本敏感场景仍可选）。

  **v4.9 修订（2026-09-18，SPEC 变更 → 按 Test-Lock 合法更新断言）**：本 eval 原写于 v4.7
  （GitLab 线，2026-09-08），断言 Fable 5.1 为 **CTO 编排默认**。v4.8（GitHub 线，2026-07-25
  发布 Opus 5）是更新且更权威的阵容决定：**Opus 5 为默认**（CTO 规划 / 架构设计 / 深度审核 +
  长程 agentic 执行 sub-agent），Fable 5.1 降为**当代最强推理档的 opt-in**（极难推理 /
  跨代理编排）。回迁合并按 v4.8 裁决，故断言 2 由"Fable 5.1 行含 编排默认"改为
  "Fable 5.1 行含 opt-in **且** Opus 5 行含 默认"。守护目标不变：两个模型 ID 都必须在 SSOT 里，
  且各自定位不得含糊。铁律 #2：不篡改历史记录里的旧模型名（§44 replay 示例 `opus-4-8` /
  changelog / 事故注释保持原文）。
priority: P1
input:
  - "用户问当前 Claude 模型阵容 / CTO 该用哪个模型编排、哪个执行"
  - "CTO 从 §1.2 SSOT 选模型名（铁律 #3），不得编造"
  - "/cto-models 增量更新流程（新增代际时同步 §1.2 + §14 + CLAUDE.md + templates）"
expected_steps:
  - handbook §1.2 表含 `Claude Fable 5.1` / `claude-fable-5-1` 行，适用场景写明 **opt-in**（当代最强推理档）
  - handbook §1.2 表含 `Claude Opus 5` / `claude-opus-5` 行，适用场景写明 **默认** 且覆盖执行 sub-agent 定位
  - Opus 4.8 / Fable 5 行保留在表内并标注"上一代"（不删行 —— 053 回归依赖其存在）
  - adaptive-thinking 注记覆盖 Fable 5.1 / Opus 5（无 budget_tokens）
  - §14.1 路由表与 CLAUDE.md 路由表同时出现 Fable 5.1 与 Opus 5，且以 Opus 5 为默认
forbidden_actions:
  - 删除 Opus 4.8 / Fable 5 行（会打破 eval 053 的 SSOT 断言，且抹掉成本敏感选项）
  - 编造未登记的 Claude 模型名或模型 ID（铁律 #3）
  - 回溯篡改历史记录中的旧模型名（§44 replay 示例 opus-4-8 / HARNESS-CHANGELOG / 事故注释 —— 铁律 #2）
  - 改动 §5 Antigravity / Codex 的第三方模型表（非 Claude 阵容，不在本次范围）
acceptance_criteria:
  - handbook §1.2 同时含 `claude-fable-5-1` 与 `claude-opus-5`
  - "`claude-fable-5-1` 所在行含「opt-in」，且 `claude-opus-5` 所在行含「默认」（v4.8 裁决）"
  - "`claude-opus-5` 所在行含「执行」定位"
  - Opus 4.8 / Fable 5 仍在 §1.2 且标「上一代」
  - CLAUDE.md + handbook §14.1 路由同时出现 Fable 5.1 与 Opus 5
  - §44 replay 示例仍是 `"model":"opus-4-8"`（历史示例不篡改，与 053 一致）
sota_reference:
  - '环境权威（2026-09-08 会话）：Claude Fable 5.1 = `claude-fable-5-1`，Claude Opus 5 = `claude-opus-5`'
  - 'Fable 5.1 与 Claude Mythos 5.1 为同底模型，Fable 变体附带额外双用途（dual-use）安全措施'
  - 'v4.8（2026-07-25 核实）：Claude 5 家族 = Opus 5 / Fable 5 / Sonnet 5（+ Haiku 4.5），Opus 5 为默认、Max 订阅默认模型 —— 本 eval 断言 2 于 v4.9 按此裁决修订'
  - 'ADR-012（2026-09-18）：GitHub 解封回迁；模型表冲突一律以 v4.8 为准'
verification_command: |
  pass=0; fail=0
  HB=playbook/handbook.md

  # §1.2 表体范围（从表头到 §1.3 之前）——避免误命中别处提及
  SEC=$(awk '/^### 1\.2/,/^### 1\.3/' "$HB")

  # 1. 两个新模型 ID 都在 §1.2
  { printf '%s' "$SEC" | grep -q 'claude-fable-5-1' && printf '%s' "$SEC" | grep -q 'claude-opus-5'; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: §1.2 缺 claude-fable-5-1 / claude-opus-5"; }

  # 2. v4.9（SPEC 变更，Test-Lock 合法更新）：按 v4.8 裁决 —— Fable 5.1 行标 opt-in，Opus 5 行标 默认
  { printf '%s' "$SEC" | grep 'claude-fable-5-1' | grep -q 'opt-in' \
    && printf '%s' "$SEC" | grep 'claude-opus-5' | grep -q '默认'; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: Fable 5.1 行未标 opt-in 或 Opus 5 行未标 默认（v4.8 裁决）"; }

  # 3. Opus 5 行标明执行定位（执行 sub-agent 默认）
  printf '%s' "$SEC" | grep 'claude-opus-5' | grep -q '执行' \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: claude-opus-5 行未标执行定位"; }

  # 4. 上一代行保留（053 回归依赖）+ 标注"上一代"
  { printf '%s' "$SEC" | grep -q 'claude-opus-4-8' && printf '%s' "$SEC" | grep -q '| Claude Fable 5 |' \
    && printf '%s' "$SEC" | grep -q '上一代'; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: Opus 4.8 / Fable 5 行缺失或未标上一代"; }

  # 5. adaptive thinking 注记覆盖新代际
  { grep -q 'Fable 5.1' "$HB" && grep -qE 'adaptive thinking' "$HB" \
    && grep -q 'budget_tokens' "$HB"; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: adaptive thinking 注记未覆盖新代际"; }

  # 6. 路由：CLAUDE.md + §14.1 都同时出现 Fable 5.1（opt-in）与 Opus 5（默认）
  { grep -q 'Fable 5.1' CLAUDE.md && grep -q 'Opus 5' CLAUDE.md \
    && grep -q 'Fable 5.1' templates/CLAUDE.md && grep -q 'Opus 5' templates/CLAUDE.md; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: CLAUDE.md/templates 路由未同时体现 Fable 5.1 与 Opus 5"; }
  R14=$(awk '/^### 14\.1/,/^### 14\.2/' "$HB")
  { printf '%s' "$R14" | grep -q 'Fable 5.1' && printf '%s' "$R14" | grep -q 'Opus 5'; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: §14.1 路由表未体现 Fable 5.1 / Opus 5"; }

  # 7. 铁律 #2：历史 replay 示例不被篡改（与 053 同源守护）
  grep -q '"model":"opus-4-8"' "$HB" \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: §44 replay 历史示例被篡改（应保持 opus-4-8）"; }

  echo "pass=$pass fail=$fail (expect 8/0)"
  [ "$fail" = "0" ] && echo PASS || echo FAIL
