id: 088-model-luna-price-2026-09
description: 2026-09-01 /cto-models 增量更新（铁律 #3 SSOT + 铁律 #2 不编造）。OpenAI 2026-07-30 调价：Luna 降 80% 至 $0.20/$1.20（cached input $0.02），Terra 降至 $2/$12，Sol 不变。Luna 补官方 API ID `gpt-5.6-luna`（OpenAI 官方模型页核实）与能力事实（1M 上下文/128K 输出/structured outputs/轻量档定位）。§14.1 新增 Luna 路由场景（海量批量抽取/分类/结构化转换——Afterglow 推荐库管线类需求），并修正 L1121 裸 `gpt-5.6`（与 §5.2 config 实测"裸串无效"结论冲突的遗留瑕疵）。多源验证：OpenAI 官方模型页 + CNBC/VentureBeat/Yahoo（WebSearch 2026-09-01）。
priority: P1
input:
  - "产品/管线需要低成本 OpenAI 模型（批量抽取/分类）→ 查手册选型"
  - "/cto-models 增量调价更新流程"
expected_steps:
  - handbook §5.2 Luna 行含 dash API ID gpt-5.6-luna + 降价日期 2026-07-30 + 新价 $0.20/$1.20 + cached $0.02
  - Terra 行降为 $2/$12 且保留原价痕迹（历史可溯）；Sol 价格不动
  - §14.1 存在 Luna 的路由场景行（批量抽取/分类），且"新 Skill 创建"行不再出现裸 gpt-5.6
  - 表头验证时间戳刷新为本次核实日期
forbidden_actions:
  - 编造未经权威源验证的价格/ID（铁律 #3）——Terra dash ID 未实测须标注"推定"
  - 回溯篡改 087 及历史 eval/changelog 中记录的发布价（$1/$6 是 2026-07-09 史实）
  - 把 Luna 写成推理主力推荐（它是轻量档，§14 场景限定批量抽取/分类）
acceptance_criteria:
  - handbook 含 'gpt-5.6-luna' + '2026-07-30' + '$0.20/$1.20'
  - handbook §14.1 含 Luna 路由行；路由表无裸 'gpt-5.6 |'（Sol/Terra/Luna 档位或 dash ID 除外）
  - 087 case 回归通过（Sol/Terra/Luna 三档与 2026-07-09 发布日仍在）
verification_command: |
  pass=0; fail=0
  HB=playbook/handbook.md
  # 1. Luna 新价 + dash ID + 降价日
  { grep -q 'gpt-5.6-luna' "$HB" && grep -q '2026-07-30' "$HB" && grep -q '\$0.20/\$1.20' "$HB"; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: Luna 缺 dash ID/降价日/新价"; }
  # 2. cached input 价 + 轻量档定位（防误当主力）
  { grep -q 'cached input \$0.02' "$HB" && grep -q '不当深度推理主力' "$HB"; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: Luna 缺 cached 价或档位定位警示"; }
  # 3. Terra 新价 + 原价留痕
  { grep -q '\$2/\$12' "$HB" && grep -q '原 \$2.50/\$15' "$HB"; } \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: Terra 价未更新或原价未留痕"; }
  # 4. §14.1 Luna 路由行存在
  grep -q '批量抽取/分类/结构化转换.*gpt-5.6 Luna' "$HB" \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: §14.1 缺 Luna 路由场景"; }
  # 5. 路由表无裸 gpt-5.6（须带 Sol/Terra/Luna 档或 dash 后缀）
  if grep -E '\| (Sonnet / )?gpt-5\.6 \|' "$HB" | grep -q .; then
    fail=$((fail+1)); echo "FAIL: 路由表仍有裸 gpt-5.6"
  else pass=$((pass+1)); fi
  # 6. 表头时间戳已刷新
  grep -q 'WebSearch 验证 2026-09-01' "$HB" \
    && pass=$((pass+1)) || { fail=$((fail+1)); echo "FAIL: §5.2 表头时间戳未刷新"; }
  echo "pass=$pass fail=$fail (expect 6/0)"
  [ "$fail" = "0" ] && echo PASS || echo FAIL
sota_reference:
  - 'developers.openai.com/api/docs/models/gpt-5.6-luna：API ID gpt-5.6-luna，$0.20/$1.20，cached $0.02，1,050,000 上下文/128K 输出，知识截止 2026-02-16（抓取 2026-09-01）'
  - 'CNBC 2026-07-30 + VentureBeat + Yahoo Finance：Luna 降 80%（$1/$6→$0.20/$1.20），Terra $2.50/$15→$2/$12，Sol 不变——三源口径一致'
