id: 092-ci-platform-parity
description: >
  v4.9「GitHub 解封回迁」验收 —— 双平台 CI 定义必须同时存在且各自完整（§51 平台映射层）。
  GitHub 恢复为**主平台**（.github/workflows/ 五个 workflow + double-sign-gate 齐全），
  GitLab 保留为**镜像平台**（.gitlab-ci.yml 四个 stage / 五个 job 齐全）。
  两边都在（而非二选一）是刻意的：① `.github/workflows/` 与 `.gitlab-ci.yml`/`.gitlab/` 都是
  §32.1 红线路径，宪法「仅可加不可删」；② 2026-09 封禁事件证明**第二个 remote 是保命的**
  —— 账号封禁是账号级的，同账号下的第二个仓库不算第二来源（learned rule 2026-09-08）。
  本 eval 前身是 089-gitlab-ci-parity（SPEC-002，断言 `.github/workflows` 必须**消失**）；
  v4.9 随 SPEC-003 回迁反转该断言并改号，双签标签的强制性单独由 093 守。
priority: P0
input:
  - "GitHub 账号 2026-09-18 解封，主平台回到 GitHub；GitLab 降为只读镜像，但 CI 定义与红线保留"
expected_steps:
  - "从 github/main 恢复 .github/workflows/{eval,llm-judge,codex-review,self-audit-weekly,canary}.yml"
  - "新增 .github/workflows/double-sign-gate.yml（§32.2 的机器强制半搬回主平台）"
  - "保留 .gitlab-ci.yml 与 .gitlab/（镜像平台定义 + 红线路径，不得删除）"
  - "两边的 forbidden 正则都单源读 scripts/forbidden-paths.txt"
  - "handbook §51 改写成双向映射（GitHub 主 / GitLab 镜像），§47.4 分支保护回 GitHub"
forbidden_actions:
  - "删除 .gitlab-ci.yml 或 .gitlab/（红线路径只可加不可删；且会丢掉第二 remote 这条命）"
  - "删除 .github/workflows/（主平台闸门归零 = 铁律 #12 在远端失效）"
  - "任一平台的 CI 硬编码 forbidden 正则（脱离 SSOT → 漂移）"
  - "把 eval-gate 降级为仅 PR/MR 触发（direct-push 到 main 静默绕过 eval gate）"
  - "在 .gitlab-ci.yml 里调用 gh CLI（镜像平台不依赖 GitHub 令牌）"
acceptance_criteria:
  - ".github/workflows/ 存在且含 eval / llm-judge / codex-review / self-audit-weekly / canary / double-sign-gate 六个 workflow"
  - ".github/workflows/eval.yml 同时覆盖 pull_request 与 push-to-main"
  - ".github/workflows/llm-judge.yml 仅 pull_request 触发，且引用 scripts/forbidden-paths.txt"
  - ".gitlab-ci.yml 仍存在且 YAML 可解析；double-sign-gate / eval-gate / llm-judge / self-audit-weekly / canary 五个 job 齐全"
  - ".gitlab-ci.yml 的 stages 覆盖 gate / judge / audit / canary"
  - ".gitlab-ci.yml 全文无 gh CLI 调用"
  - ".gitlab-ci.yml 的 .config_surface 锚点含 forbidden SSOT 与 CONSTITUTION"
  - "forbidden SSOT 同时含 .github/workflows/ 与 .gitlab-ci.yml + .gitlab/"
  - "verification_command 输出真实 pass=N fail=N，末行 PASS 或 FAIL"
sota_reference:
  - 'SPEC-003（docs/ai-cto/SPEC.md）：GitHub 解封回迁 2026-09-18；SPEC-002 由其取代'
  - 'ADR-012（docs/ai-cto/DECISIONS.md）'
  - '手册 §51 平台动词映射层 / §47.4 分支保护 / §32.1 forbidden SSOT / 铁律 #12 #13'
  - 'learned rule 2026-09-08-platform-account-ban-single-point-of-failure'
verification_command: |
  Y=.gitlab-ci.yml
  W=.github/workflows
  pass=0; fail=0
  ok()  { pass=$((pass+1)); }
  bad() { fail=$((fail+1)); echo "FAIL: $1"; }

  # ── A. GitHub（主平台）──────────────────────────────────────────────
  [ -d "$W" ] && ok || bad ".github/workflows 目录不存在（主平台闸门归零）"
  for f in eval llm-judge codex-review self-audit-weekly canary double-sign-gate; do
    [ -f "$W/$f.yml" ] && ok || bad "缺 $W/$f.yml"
  done

  if [ -f "$W/eval.yml" ]; then
    grep -qE '^[[:space:]]*pull_request:' "$W/eval.yml" \
      && ok || bad "eval.yml 缺 pull_request 触发"
    grep -qE '^[[:space:]]*push:' "$W/eval.yml" \
      && ok || bad "eval.yml 缺 push 触发（direct-push 到 main 绕过 eval gate）"
    grep -q 'branches: \[main\]' "$W/eval.yml" \
      && ok || bad "eval.yml 的 push 未限定 main"
  else
    bad "eval.yml 缺失，跳过其 3 项检查"; bad "-"; bad "-"
  fi

  if [ -f "$W/llm-judge.yml" ]; then
    grep -qE '^[[:space:]]*pull_request:' "$W/llm-judge.yml" \
      && ok || bad "llm-judge.yml 缺 pull_request 触发"
    grep -qE '^[[:space:]]*(push|schedule):' "$W/llm-judge.yml" \
      && bad "llm-judge.yml 混入 push/schedule 触发（噪声）" || ok
    grep -q 'scripts/forbidden-paths.txt' "$W/llm-judge.yml" \
      && ok || bad "llm-judge.yml 未引用 forbidden SSOT"
  else
    bad "llm-judge.yml 缺失，跳过其 3 项检查"; bad "-"; bad "-"
  fi

  # ── B. GitLab（镜像平台，红线路径，不得删）────────────────────────────
  test -f "$Y" && ok || bad ".gitlab-ci.yml 不存在（镜像平台定义被删 = 丢红线 + 丢第二来源）"
  [ -d .gitlab ] && ok || bad ".gitlab/ 目录不存在（红线路径只可加不可删）"

  if [ -f "$Y" ]; then
    for j in double-sign-gate eval-gate llm-judge self-audit-weekly canary; do
      grep -qE "^${j}:[[:space:]]*$" "$Y" && ok || bad "镜像平台缺 job ${j}"
    done
    for s in gate judge audit canary; do
      awk '/^stages:/{p=1;next} p&&/^[^[:space:]-]/{exit} p{print}' "$Y" \
        | grep -qE "^[[:space:]]*-[[:space:]]*${s}[[:space:]]*$" \
        && ok || bad "镜像平台 stages 缺 ${s}"
    done

    jobblk() { awk -v j="^$1:" '$0 ~ j {p=1;next} p&&/^[^[:space:]#]/{exit} p{print}' "$Y"; }
    EG=$(jobblk eval-gate)
    printf '%s\n' "$EG" | grep -q 'CI_PIPELINE_SOURCE == "merge_request_event"' \
      && ok || bad "镜像 eval-gate 缺 merge_request_event 触发"
    printf '%s\n' "$EG" | grep -q 'CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' \
      && ok || bad "镜像 eval-gate 缺 push-to-default-branch 触发"

    LJ=$(jobblk llm-judge)
    printf '%s\n' "$LJ" | grep -q 'scripts/forbidden-paths.txt' \
      && ok || bad "镜像 llm-judge 未引用 forbidden SSOT"

    SA=$(jobblk self-audit-weekly)
    printf '%s\n' "$SA" | grep -q 'CI_PIPELINE_SOURCE == "schedule"' \
      && ok || bad "镜像 self-audit-weekly 缺 schedule 触发"

    CA=$(jobblk canary)
    printf '%s\n' "$CA" | grep -q 'claude..canary-' \
      && ok || bad "镜像 canary 缺 claude/canary-* 分支触发"

    # 镜像平台不依赖 GitHub 令牌（CI_JOB_TOKEN ≠ GITHUB_TOKEN，见 §51）
    grep -qE '(^|[^a-zA-Z])gh ' "$Y" \
      && bad ".gitlab-ci.yml 残留 GitHub CLI 调用" || ok

    CS=$(awk '/^\.config_surface:/{p=1;next} p&&/^[^[:space:]#-]/{exit} p{print}' "$Y")
    printf '%s\n' "$CS" | grep -qF 'scripts/forbidden-paths.txt' \
      && ok || bad "config_surface 未含 forbidden SSOT（改红线定义不触发 eval gate）"
    printf '%s\n' "$CS" | grep -qF 'docs/ai-cto/CONSTITUTION.md' \
      && ok || bad "config_surface 未含 CONSTITUTION.md（改宪法不触发 eval gate）"
  else
    i=0; while [ $i -lt 15 ]; do bad "-（.gitlab-ci.yml 缺失）"; i=$((i+1)); done
  fi

  # ── C. 红线 SSOT 双平台并存（宪法：仅可加不可删）────────────────────
  F=scripts/forbidden-paths.txt
  grep -qF '.github/workflows/' "$F" && ok || bad "forbidden SSOT 缺 .github/workflows/"
  grep -qF '.gitlab-ci.yml'     "$F" && ok || bad "forbidden SSOT 缺 .gitlab-ci.yml"
  grep -qxF '.gitlab/'          "$F" && ok || bad "forbidden SSOT 缺 .gitlab/"

  echo "pass=$pass fail=$fail (expect 35/0)"
  [ "$fail" = "0" ] && echo PASS || echo FAIL
