# GitLab 是镜像（第二个可写 remote，见 lesson 2026-09-08-platform-account-ban）。
# 与 .github/workflows/ci.yml 跑同一套检查；主平台不可用时这里仍能验证。
test:
  image: node:22
  script:
    - node --test plugin/hooks/engine/guard.test.mjs plugin/scripts/migrate-v4-project.test.mjs
    - node scripts/check.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
