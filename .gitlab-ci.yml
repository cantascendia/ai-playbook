# =============================================================================
# ai-playbook GitLab CI — SPEC-002「GitHub → GitLab 平台迁移」（2026-09-08）
#
# 本文件整体替代已删除的 5 个 GitHub Actions workflow：
#
#   .github/workflows/eval.yml              →  job `eval-gate`          (stage: gate)
#   .github/workflows/llm-judge.yml         →  job `llm-judge`          (stage: judge)
#   .github/workflows/codex-review.yml      →  job `codex-review`       (stage: judge)
#   .github/workflows/self-audit-weekly.yml →  job `self-audit-weekly`  (stage: audit)
#   .github/workflows/canary.yml            →  job `canary`             (stage: canary)
#
# Constitution / 铁律合规（SPEC-002 验收标准）：
#   main 保护 = **GitLab Protected Branch**（Allowed to push: No one /
#   Allowed to merge: Maintainers），一切改动走 Merge Request，配合项目设置
#   「Pipelines must succeed」（由编排者在 Settings → Merge requests 开启）→
#   `eval-gate` 失败即无法 merge。等价于旧 GitHub branch protection 的
#   required status check，铁律 #12（无 eval 的 agent 配置改动不得进 main）
#   由此在 GitLab 侧继续成立。
#
# 平台约束（刻意为之，勿回退）：
#   - 全文 0 处 `gh` CLI 调用 —— GitHub 账号已封禁、token 失效（SPEC-002 验收标准）。
#   - CI 内**不用** glab（保持 runner 依赖最小）；需要平台 API 时直接 curl $CI_API_V4_URL。
#   - MR note / Issue 写入用 `PRIVATE-TOKEN: $GITLAB_TOKEN`（项目 CI variable，建议 masked）。
#     CI_JOB_TOKEN 在 gitlab.com 上**无** notes / issues 写权限，刻意不用。
#   - 未配置 GITLAB_TOKEN 一律**优雅跳过**（把内容打印到 job log），既不假绿也不硬失败。
#   - CI 从不 commit 回仓库；产物一律走 artifacts。
#
# 变更日志：
#   2026-09-08 review fixes —— 独立评审 7 项修复：
#     P1 `&config_surface` 扩面（forbidden/business 路径 SSOT、CONSTITUTION、settings.json、
#        .claude/rules/、pre-commit 安装器、skills manifest、templates/、.gitlab/）；
#     P1 §32.2 双签标签**真强制**（eval-gate 阻断 + llm-judge 命中时自动打标）；
#     P2 纯文档 push 到 main 不再产生 0-job 的红 pipeline（workflow 默认分支规则挂 changes）；
#     P2 GITLAB_TOKEN 不再出现在 curl argv（改 `-H @headerfile`，用后即删）；
#     P2 self-audit rolling issue 查询失败时不再误关全部 self-audit issue；
#     P2 `grep -c ... || echo 0` 的 "0 换行 0" 计数污染；
#     P2 pipeline 去重措辞如实化（canary 分支 + 开着的 MR 仍会双跑）。
# =============================================================================

default:
  image: node:22
  interruptible: true

stages:
  - gate
  - judge
  - audit
  - canary

# -----------------------------------------------------------------------------
# config surface SSOT（2026-09-08 review fixes P1/P2）
#
# 「改到这些路径 = 改到 agent 行为面」的单一定义，被 workflow.rules 与 eval-gate.rules
# 共用。YAML anchor 必须**先定义后引用**，故本块必须放在 `workflow:` 之上。
# 顶层 `.` 开头的 key 在 GitLab CI 里是 hidden job，不会被当作真实 job 执行。
# -----------------------------------------------------------------------------
.config_surface: &config_surface
  - '.claude/commands/**/*'
  - '.claude/agents/**/*'
  - '.claude/skills/**/*'
  - '.claude/hooks/**/*'
  - '.claude/rules/**/*'
  - '.claude/settings.json'
  - '.agents/skills/**/*'
  - '.agents/skills-manifest.json'
  - 'CLAUDE.md'
  - 'playbook/handbook.md'
  - 'docs/ai-cto/CONSTITUTION.md'
  - 'docs/ai-cto/COUNTS.md'
  - 'evals/**/*'
  - 'scripts/run-evals.sh'
  - 'scripts/check-counts.sh'
  - 'scripts/check-forbidden-consistency.sh'
  - 'scripts/install-pre-commit.sh'
  - 'scripts/forbidden-paths.txt'
  - 'scripts/business-paths.txt'
  - 'templates/**/*'
  - '.gitlab-ci.yml'
  - '.gitlab/**/*'

# 建 pipeline 的场景：MR / 默认分支 push（仅配置面改动）/ 定时 / 手动(web) / canary 分支。
# 普通 feature 分支 push 不建 pipeline，少一份重复；但这**不等于**全局零重复：
# `claude/canary-*` 分支若同时开着 MR，MR pipeline 与分支 pipeline 会并存。
# 给 canary 规则加 `$CI_OPEN_MERGE_REQUESTS == null` 能去掉这份重复，但 canary job 只认
# 分支变量（MR pipeline 里 $CI_COMMIT_BRANCH 为空），那样一开 MR 就再也不跑 canary ——
# 权衡后**刻意保留**这一处重复，此处如实记录而非声称"无重复流水线"。
# 默认分支 push 挂 changes：纯文档 push 到 main 不再产生「No stages / jobs」的红 pipeline。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *config_surface
    - if: '$CI_COMMIT_BRANCH =~ /^claude\/canary-/'

# -----------------------------------------------------------------------------
# eval-gate（原 .github/workflows/eval.yml）—— 铁律 #12
#
# 触发：MR ；或直接 push 到默认分支（main）。
# v4.1 (SPEC-001 item 3) 的「闭合 push-不走-PR 缺口」在 GitLab 侧保留：直接 push 到
# main 也跑 eval gate（事后信号）；真正阻断靠 GitLab protected branch
# （main: No one push / Maintainers merge）+ 「Pipelines must succeed」——
# 属仓库治理开关（改变人的 direct-push 权限），见 SPEC-002 人工步。
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# double-sign-gate — §32.2 双签 gate（2026-09-08 review fixes P1，独立 job）
# 铁律 #13 的**可执行**部分。以前"forbidden 路径要打 requires-double-review 标签"只写在文档里，
# CI 从不校验；现在 MR 触及 forbidden 路径而未打标 → exit 1，配合 protected branch 的
# 「Pipelines must succeed」真阻断 merge。
# 为什么独立成 job 而不放 eval-gate：eval-gate 只在 config_surface 变动时才建 job，
# 一个只碰 src/auth/** 的 MR 不会跑 eval-gate → 标签检查永远不触发（二审残余缺口）。
# 本 job 对**每个 MR** 都跑、无 changes 过滤、无 token 依赖（$CI_MERGE_REQUEST_LABELS 预定义）。
# 注：llm-judge（stage judge，在本 job 之后）会在命中时自动补打该标签，但打标不会重跑当前
# pipeline —— 补标后的下一次 push / 手动重跑才会通过，这是刻意的人审停顿点。
# -----------------------------------------------------------------------------
double-sign-gate:
  stage: gate
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      set -u
      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE_SHA" ]; then
        echo "CI_MERGE_REQUEST_DIFF_BASE_SHA 为空 — 无法计算 diff，跳过双签标签检查。"
        exit 0
      fi
      git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
        || git fetch --no-tags --depth=200 origin "$BASE_SHA"
      changed_files="$(git diff --name-only "$BASE_SHA" "$CI_COMMIT_SHA")"

      # forbidden 正则单源读 SSOT（同 llm-judge / forbidden-guard.sh）。
      # CRLF 兜底：\r 混进正则会导致永远测不出 forbidden 路径（静默失效，最危险）。
      if [ -f scripts/forbidden-paths.txt ]; then
        forbidden_regex="$(
          tr -d '\r' < scripts/forbidden-paths.txt |
            sed -E 's/[[:space:]]*#.*$//' |
            sed -E '/^[[:space:]]*$/d' |
            paste -sd'|' -
        )"
      else
        forbidden_regex='auth/|payment/|billing/|secrets/|keys/|migration|crypto/|infra/|terraform/|\.github/workflows/|\.gitlab-ci\.yml|\.gitlab/'
      fi

      touched="$(printf '%s\n' "$changed_files" | grep -E "$forbidden_regex" || true)"
      if [ -z "$touched" ]; then
        echo "本 MR 未触及 §32.1 forbidden 路径 — 双签标签非必需。"
        exit 0
      fi
      echo "本 MR 触及 §32.1 forbidden 路径："
      printf '%s\n' "$touched" | sed 's/^/  /'
      case ",${CI_MERGE_REQUEST_LABELS:-}," in
        *,requires-double-review,*)
          echo "已打 requires-double-review 标签 — 双签流程已启动，继续。"
          ;;
        *)
          echo "forbidden 路径改动需先打 requires-double-review 标签（§32.2 双签）"
          exit 1
          ;;
      esac

eval-gate:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *config_surface
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *config_surface
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
  before_script:
    # node:22 是 Debian 底；python3/PyYAML 用于 yaml 结构校验与 skill manifest 一致性。
    # 已存在就不装（省 CI 时间）；装失败直接让 job 失败，绝不静默跳过校验。
    - |
      if ! python3 -c 'import yaml' >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y -qq python3 python3-yaml
      fi
      python3 --version
      node --version
  script:
    # §32.2 双签 gate（2026-09-08 review fixes P1）—— 铁律 #13 的**可执行**部分。
    # 以前"forbidden 路径要打 requires-double-review 标签"只写在文档里，CI 从不校验；
    # 现在 MR 触及 forbidden 路径而未打标 → exit 1，配合 protected branch 的
    # 「Pipelines must succeed」真阻断 merge。
    # $CI_MERGE_REQUEST_LABELS 是 GitLab 预定义变量（逗号分隔），**不需要任何 token**。
    # 注：llm-judge（stage judge，在本 job 之后）会在命中时自动补打该标签，但打标不会
    # 重跑当前 pipeline —— 补标后的下一次 push / 手动重跑才会通过，这是刻意的人审停顿点。
    - |
      set -u
      if [ "${CI_PIPELINE_SOURCE:-}" != "merge_request_event" ]; then
        echo "非 MR pipeline — 跳过 §32.2 双签标签检查。"
      else
        BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
        if [ -z "$BASE_SHA" ]; then
          echo "CI_MERGE_REQUEST_DIFF_BASE_SHA 为空 — 无法计算 diff，跳过双签标签检查。"
        else
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=200 origin "$BASE_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$CI_COMMIT_SHA")"

          # forbidden 正则单源读 SSOT（同 llm-judge / forbidden-guard.sh）。
          # CRLF 兜底：\r 混进正则会导致永远测不出 forbidden 路径（静默失效，最危险）。
          if [ -f scripts/forbidden-paths.txt ]; then
            forbidden_regex="$(
              tr -d '\r' < scripts/forbidden-paths.txt |
                sed -E 's/[[:space:]]*#.*$//' |
                sed -E '/^[[:space:]]*$/d' |
                paste -sd'|' -
            )"
          else
            forbidden_regex='auth/|payment/|billing/|secrets/|keys/|migration|crypto/|infra/|terraform/|\.github/workflows/|\.gitlab-ci\.yml|\.gitlab/'
          fi

          touched="$(printf '%s\n' "$changed_files" | grep -E "$forbidden_regex" || true)"
          if [ -z "$touched" ]; then
            echo "本 MR 未触及 §32.1 forbidden 路径 — 双签标签非必需。"
          else
            echo "本 MR 触及 §32.1 forbidden 路径："
            printf '%s\n' "$touched" | sed 's/^/  /'
            case ",${CI_MERGE_REQUEST_LABELS:-}," in
              *,requires-double-review,*)
                echo "已打 requires-double-review 标签 — 双签流程已启动，继续。"
                ;;
              *)
                echo "forbidden 路径改动需先打 requires-double-review 标签（§32.2 双签）"
                exit 1
                ;;
            esac
          fi
        fi
      fi

    - |
      N=$(ls evals/golden-trajectories/*.yaml 2>/dev/null | wc -l)
      echo "Found $N golden trajectories"

    # v3.13 SSOT gate（SOTA team 审计 R1）：COUNTS.md 自称唯一计数源但一直无 enforcer
    # → 计数漂移（hooks 写 9 实 10）。check-counts.sh 比对 COUNTS vs 文件系统，不符 exit 1。
    # 同时硬查 5 个安全红线 guard 存在（防 cto-init 安装链断裂复发）。
    - |
      echo "--- Check counts SSOT (R1) ---"
      chmod +x scripts/check-counts.sh
      bash scripts/check-counts.sh

    # v4.0e: guard engine 单测（node:test）纳入 gate — 引擎红线逻辑回归防护。
    - |
      echo "--- Guard engine unit tests ---"
      if [ -f .claude/hooks/engine/guard.test.mjs ]; then
        node --test .claude/hooks/engine/guard.test.mjs
      else
        echo "no engine unit suite — skipped"
      fi

    # v3.12 核心 gate（飞轮第 7-8 轮 team 修「铁律 #12 eval 空壳」）：
    # 旧 CI 只 count yaml + assert 字段存在 = §32.5 反模式 #6 eval-gaming。
    # 现在真跑每个 verification_command，FAIL → exit 1 阻 merge。
    - |
      echo "--- Run executable evals (real execution) ---"
      chmod +x scripts/run-evals.sh
      bash scripts/run-evals.sh

    - |
      echo "--- Validate yaml structure ---"
      python3 - <<'PY'
      import yaml, glob, sys
      bad = 0
      for f in sorted(glob.glob('evals/golden-trajectories/*.yaml')):
          try:
              d = yaml.safe_load(open(f, encoding='utf-8'))
              for k in ('id','description','expected_steps','forbidden_actions','acceptance_criteria'):
                  assert k in d, f"{f} missing {k}"
          except Exception as e:
              print(f"STRUCTURE FAIL: {e}")
              bad += 1
      if bad:
          sys.exit(1)
      print("all yaml structure + required fields OK")
      PY

    - |
      echo "--- Skill manifest consistency ---"
      python3 - <<'PY'
      import json, os, sys
      mf = '.agents/skills-manifest.json'
      if os.path.exists(mf):
          m = json.load(open(mf, encoding='utf-8'))
          missing = [s['skillId'] for s in m.get('skills', []) if not os.path.exists(s['location'])]
          if missing:
              print("MISSING physical file:", missing)
              sys.exit(1)
          print("skill manifest OK")
      else:
          print("no manifest — skipped")
      PY

    - |
      echo "--- Frontmatter completeness ---"
      MISSING=0
      for f in .claude/commands/cto-*.md; do
        head -1 "$f" | grep -q '^---$' || { echo "$f missing frontmatter"; MISSING=$((MISSING+1)); }
      done
      [ $MISSING -eq 0 ] || { echo "$MISSING commands without frontmatter"; exit 1; }

    - echo "Eval gate passed (counts-SSOT + engine-unit + real-exec + structure + frontmatter)"

# -----------------------------------------------------------------------------
# llm-judge（原 .github/workflows/llm-judge.yml）—— §47.2
#
# 仅 MR 触发，advisory（allow_failure: true，永不阻断）。无密钥启发式风险信号。
# forbidden 正则单源读 scripts/forbidden-paths.txt（同 forbidden-guard.sh），
# 缺文件时回退到与全项目一致的 SSOT 字符串（含 .gitlab-ci.yml / .gitlab/ 新红线）。
# -----------------------------------------------------------------------------
llm-judge:
  stage: judge
  allow_failure: true
  variables:
    # 需要完整历史才能 diff 到 $CI_MERGE_REQUEST_DIFF_BASE_SHA
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      set -u

      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      HEAD_SHA="${CI_COMMIT_SHA}"

      if [ "${CI_MERGE_REQUEST_DRAFT:-false}" = "true" ]; then
        echo "Draft MR，跳过 LLM-as-Judge advisory。"
        exit 0
      fi

      if [ -z "$BASE_SHA" ]; then
        echo "CI_MERGE_REQUEST_DIFF_BASE_SHA 为空 — 无法计算 diff，跳过 advisory。"
        exit 0
      fi

      git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
      git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"

      changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

      # 优先使用仓库维护的 forbidden path SSOT；缺失时回退到保守默认值。
      # scripts/forbidden-paths.txt 可能是 CRLF（Windows 编辑）；Linux runner 的 sed/paste
      # 不做 CRLF 转换 —— 显式 tr -d '\r' 兜底，防止 \r 混进正则导致静默检测失效
      # （不报错，只是永远测不出 forbidden 路径，最危险的一类 bug）。
      if [ -f scripts/forbidden-paths.txt ]; then
        forbidden_regex="$(
          tr -d '\r' < scripts/forbidden-paths.txt |
            sed -E 's/[[:space:]]*#.*$//' |
            sed -E '/^[[:space:]]*$/d' |
            paste -sd'|' -
        )"
      else
        forbidden_regex='auth/|payment/|billing/|secrets/|keys/|migration|crypto/|infra/|terraform/|\.github/workflows/|\.gitlab-ci\.yml|\.gitlab/'
      fi

      forbidden_count="$(printf '%s\n' "$changed_files" | grep -cE "$forbidden_regex" || true)"
      agent_config_count="$(printf '%s\n' "$changed_files" | grep -cE '(\.claude/|CLAUDE\.md|playbook/handbook\.md)' || true)"
      test_eval_count="$(printf '%s\n' "$changed_files" | grep -cE '(tests?/|evals/)' || true)"
      mr_body_len="$(printf '%s' "${CI_MERGE_REQUEST_DESCRIPTION:-}" | wc -c | tr -d '[:space:]')"

      if [ "$mr_body_len" -lt 50 ]; then
        desc_signal="fail (<50 chars)"
      elif [ "$mr_body_len" -lt 200 ]; then
        desc_signal="warn (<200 chars)"
      else
        desc_signal="pass"
      fi

      if [ "$forbidden_count" -gt 0 ]; then
        echo "LLM-as-Judge advisory: forbidden 路径命中 $forbidden_count 个，请按手册 §47 做人工复核。"
      fi

      # 逐行 printf 顶格写（Markdown 表格遇 4+ 空格缩进会渲染成代码块）。
      note_file="$(mktemp)"
      {
        printf '## LLM-as-Judge advisory (§47.2)\n\n'
        printf '| 维度 | 信号 |\n| --- | --- |\n'
        printf '| Forbidden paths | %s |\n' "$forbidden_count"
        printf '| Agent config changes | %s |\n' "$agent_config_count"
        printf '| Test / eval changes | %s |\n' "$test_eval_count"
        printf '| MR description | %s |\n\n' "$desc_signal"
        printf '仅无密钥启发式信号，完整见手册 §47。advisory-only，不阻断 merge。\n'
      } > "$note_file"

      cat "$note_file"

      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "GITLAB_TOKEN not set — skipping MR note / 自动打标（advisory 内容已打印在上方 job log）"
        exit 0
      fi

      # token 不进 curl argv（2026-09-08 review fixes P2）：同机 runner 上 `ps` / /proc
      # 能看到别的 job 的命令行，argv 里的 PRIVATE-TOKEN 等于把 masked 变量泄给旁路进程。
      # 写成 0600 临时头文件，用 `-H @file` 让 curl 自己读，用后即删（trap 兜底）。
      umask 077
      hdr="$(mktemp)"
      trap 'rm -f "$hdr" "$note_file"' EXIT
      printf '%s\n' "PRIVATE-TOKEN: ${GITLAB_TOKEN}" > "$hdr"

      curl --silent --show-error --fail \
        --request POST \
        --header @"$hdr" \
        --data-urlencode "body@${note_file}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
        > /dev/null && echo "MR note posted." || echo "MR note POST 失败（advisory，不阻断）"

      # 命中 forbidden 路径 → 自动补打 requires-double-review 标签（§32.2）。
      # 打标本身不阻断（本 job allow_failure: true）；真正的阻断在 stage gate 的
      # eval-gate 双签检查里。CI 内不用 glab，直接 curl $CI_API_V4_URL。
      if [ "$forbidden_count" -gt 0 ]; then
        echo "Forbidden paths detected; advisory only, not blocking."
        curl --silent --show-error --fail \
          --request PUT \
          --header @"$hdr" \
          --data-urlencode "add_labels=requires-double-review" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" \
          > /dev/null \
          && echo "已自动补打 requires-double-review 标签（§32.2 双签）" \
          || echo "打标失败（advisory，不阻断）—— 请人工在 MR 上加 requires-double-review"
      fi

      rm -f "$hdr"

# -----------------------------------------------------------------------------
# codex-review（原 .github/workflows/codex-review.yml）—— §48 兜底
#
# 占位 job（与旧 workflow 同为 placeholder）：真实集成需要 OPENAI_API_KEY CI variable。
# 仅 MR 触发，且需显式把 CI variable CODEX_REVIEW_ENABLED 设为 "true" 才建 job。
# forbidden 路径命中时**不**上传代码给 OpenAI（敏感路径必须人工 review）。
# -----------------------------------------------------------------------------
codex-review:
  stage: judge
  allow_failure: true
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: '$CODEX_REVIEW_ENABLED == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      set -u
      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$BASE_SHA" ]; then
        echo "无 CI_MERGE_REQUEST_DIFF_BASE_SHA — 跳过。"
        exit 0
      fi
      git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"

      FORBIDDEN=$(git diff --name-only "$BASE_SHA" "$CI_COMMIT_SHA" \
        | grep -cE '(auth|payment|secrets|migration|crypto|infra)/' || true)
      [ -z "$FORBIDDEN" ] && FORBIDDEN=0

      if [ "$FORBIDDEN" != "0" ]; then
        echo "Codex Review Skipped — MR 触及 §32.1 forbidden 路径（auth/payment/secrets/migration/crypto/infra）。"
        echo "Codex review 会上传代码到 OpenAI，敏感路径必须人工 review。"
        exit 0
      fi

      if [ -z "${OPENAI_API_KEY:-}" ]; then
        echo "OPENAI_API_KEY CI variable 未配置；跳过 Codex review。"
        echo "本地若已 codex login，Stop hook 会通过 codex-bridge skill 处理。"
        exit 0
      fi

      echo "Run codex review (placeholder — 真实集成需 OPENAI_API_KEY CI variable)"
      # 真实集成时在此调用 codex CLI / OpenAI API：
      #   diff_base=$BASE_SHA
      #   spec_file=docs/ai-cto/SPEC.md
      #   constitution_file=docs/ai-cto/CONSTITUTION.md
      #   eval_dimensions=architecture,quality,perf,security,test,dx,functional,ux

# -----------------------------------------------------------------------------
# self-audit-weekly（原 .github/workflows/self-audit-weekly.yml）—— v3.9 飞轮
#
# 触发：GitLab **Pipeline schedule**（Settings → CI/CD → Pipeline schedules，
#       建议 cron `0 9 * * 1` = 每周一 UTC 09:00 / 北京时间 17:00）；web 手动可选。
# 输出：docs/ai-cto/SELF-AUDIT-<date>.md 作为 **artifact**（CI 从不 commit 回仓库）。
# 滚动 issue：经 GitLab Issues API（curl + GITLAB_TOKEN），复用带 self-audit-rolling
#             标签的 open issue，否则新建；其余 self-audit issue 评论 superseded 后关闭。
# -----------------------------------------------------------------------------
self-audit-weekly:
  stage: audit
  timeout: 15 minutes
  variables:
    GIT_DEPTH: '100'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - 'docs/ai-cto/SELF-AUDIT-*.md'
  before_script:
    - |
      if ! command -v jq >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y -qq jq
      fi
      jq --version
  script:
    # 1. 计算飞轮健康指标（逐字移植自旧 workflow，仅把 Actions 的 step-output 机制换成普通 shell 变量）
    - |
      TRAJ_COUNT=0; REVIEW_COUNT=0; BLOCK_COUNT=0; LEARNED=0
      if [ -d .claude/agent-logs ]; then
        TRAJ_COUNT=$(find .claude/agent-logs -name '*.jsonl' -mtime -30 -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}')
      fi
      if [ -f docs/ai-cto/CODEX-REVIEW-LOG.md ]; then
        # `grep -c` 无匹配时**已经**打印 "0" 且 exit 1 —— 再 `|| echo 0` 会得到
        # "0\n0"，指标行渲染成两行垃圾（2026-09-08 review fixes P2）。用 `|| true`，
        # 空值交给下面的 ${VAR:-0} 兜底。
        REVIEW_COUNT=$(grep -c "mode=success" docs/ai-cto/CODEX-REVIEW-LOG.md 2>/dev/null || true)
      fi
      if [ -d .claude/agent-logs ]; then
        BLOCK_COUNT=$(grep -h "immutable-blocked\|forbidden-blocked\|bypass-blocked" .claude/agent-logs/*.jsonl 2>/dev/null | wc -l)
      fi
      if [ -d .claude/rules/learned ]; then
        LEARNED=$(find .claude/rules/learned -name '*.md' -not -name 'README.md' -not -name '.gitkeep' | wc -l)
      fi
      export TRAJ_COUNT="${TRAJ_COUNT:-0}" REVIEW_COUNT="${REVIEW_COUNT:-0}"
      export BLOCK_COUNT="${BLOCK_COUNT:-0}" LEARNED="${LEARNED:-0}"

      # 2. Pattern detection（轻量 — bash only，CI 上不跑 sub-agent）
      mkdir -p docs/ai-cto
      DATE=$(date +%Y-%m-%d)
      OUT="docs/ai-cto/SELF-AUDIT-${DATE}.md"

      {
        echo "# Self-Audit ${DATE} (CI schedule)"
        echo ""
        echo "> GitLab CI pipeline schedule 自动生成。仅记录可机器检测的 pattern。"
        echo "> 深度分析（pattern-detector sub-agent）需在本地 \`/cto-evolve detect\` 跑。"
        echo ""
        echo "## 总览"
        echo "- Trajectory 条目: ${TRAJ_COUNT}"
        echo "- Codex review 次数: ${REVIEW_COUNT}"
        echo "- Hook 阻止次数: ${BLOCK_COUNT}"
        echo "- Learned rules: ${LEARNED}"
        echo ""
        echo "## 机器检测的 Pattern"
        echo ""

        if [ -d .claude/agent-logs ]; then
          echo "### A. Hook 重复触发 Top 5"
          grep -h "forbidden-blocked\|immutable-blocked" .claude/agent-logs/*.jsonl 2>/dev/null \
            | grep -oP '"details":"[^"]*"' \
            | sort | uniq -c | sort -rn | head -5 \
            | awk '{print "- "$0}'
          echo ""
        fi

        if [ -f docs/ai-cto/REVIEW-QUEUE.md ]; then
          echo "### B. Codex review 高频关键词（最近 30 天）"
          tail -1000 docs/ai-cto/REVIEW-QUEUE.md \
            | grep -oP '\[P[0-3]\]\s+[^—\n]+' \
            | sort | uniq -c | sort -rn | head -5 \
            | awk '{print "- "$0}'
          echo ""
        fi

        if [ -f docs/ai-cto/CODEX-REVIEW-LOG.md ]; then
          echo "### E. Codex review 字节累计（最近 30 天）"
          grep "mode=success" docs/ai-cto/CODEX-REVIEW-LOG.md \
            | grep -oP 'bytes=\d+' \
            | awk -F= '{sum+=$2} END{print "- 总 bytes: "sum" (估 $"sum/100000".XX)"}'
          echo ""
        fi

        echo "## 下一步"
        echo "- 本地跑 \`/cto-evolve detect\` 做深度分析（含 codex 跨模型审）"
        echo "- 用 \`/cto-evolve propose\` 把 pattern 转成 EVOLUTION-PROPOSAL"
        echo "- 用 \`/cto-evolve apply <id>\` 实施"
      } > "$OUT"

      cat "$OUT"
      echo "$OUT" > .self-audit-file

    # 3. 写 GitLab Issue（滚动单 issue — 不开 MR，业界共识：人审为主）
    - |
      set -u
      DATE=$(date +%Y-%m-%d)
      OUT="$(cat .self-audit-file)"
      TITLE="v3.9 Self-Audit ${DATE}"
      BODY_FILE="$(mktemp)"
      {
        cat "$OUT"
        printf '\n\n---\n\n_由 .gitlab-ci.yml job `self-audit-weekly` 自动生成_\n'
      } > "$BODY_FILE"

      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "GITLAB_TOKEN not set — skipping rolling issue（报告已作为 artifact 保留）"
        exit 0
      fi

      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues"

      # token 不进 curl argv（2026-09-08 review fixes P2）：0600 头文件 + `-H @file`，
      # 用后即删（trap 兜底，覆盖 set -e / exit 0 各条退出路径）。
      umask 077
      HDR="$(mktemp)"
      trap 'rm -f "$HDR" "$BODY_FILE"' EXIT
      printf '%s\n' "PRIVATE-TOKEN: ${GITLAB_TOKEN}" > "$HDR"

      # (1) 查已有的 open rolling issue（label self-audit-rolling）
      rollingIid="$(curl --silent --fail --header @"$HDR" \
        "${API}?state=opened&labels=self-audit-rolling&per_page=1" | jq -r '.[0].iid // empty')"

      if [ -n "$rollingIid" ]; then
        # (2) 已存在 → 原地更新标题（含最新日期）+ description（最新报告）+ 刷新评论
        curl --silent --fail --request PUT --header @"$HDR" \
          --data-urlencode "title=${TITLE}" \
          --data-urlencode "description@${BODY_FILE}" \
          "${API}/${rollingIid}" > /dev/null
        curl --silent --fail --request POST --header @"$HDR" \
          --data-urlencode "body=audit refreshed ${DATE}" \
          "${API}/${rollingIid}/notes" > /dev/null
        echo "rolling issue #${rollingIid} updated"
      else
        # (3) 不存在 → 新建滚动 issue（打 self-audit-rolling 标签供下轮复用）
        rollingIid="$(curl --silent --fail --request POST --header @"$HDR" \
          --data-urlencode "title=${TITLE}" \
          --data-urlencode "description@${BODY_FILE}" \
          --data-urlencode "labels=self-audit,self-audit-rolling,v3.9-flywheel" \
          "${API}" | jq -r '.iid')"
        echo "rolling issue #${rollingIid} created"
      fi

      # (3.5) 熔断（2026-09-08 review fixes P2）：上面任一 curl / jq 失败都会让
      # rollingIid 为空 —— 此时 (4) 的 `[ "$iid" != "" ]` 对每个 issue 都成立，
      # 会把**全部** open 的 self-audit issue 一次性关光。宁可不清理，也不误关。
      [ -n "$rollingIid" ] || { echo "rolling issue 未确定 — 跳过清理"; exit 0; }

      # (4) 关闭其余仍 open 的 self-audit issue（被滚动 issue 取代，去噪）
      for iid in $(curl --silent --fail --header @"$HDR" \
          "${API}?state=opened&labels=self-audit&per_page=100" | jq -r '.[].iid'); do
        if [ "$iid" != "$rollingIid" ]; then
          curl --silent --fail --request POST --header @"$HDR" \
            --data-urlencode "body=superseded by rolling issue #${rollingIid}" \
            "${API}/${iid}/notes" > /dev/null
          curl --silent --fail --request PUT --header @"$HDR" \
            --data-urlencode "state_event=close" \
            "${API}/${iid}" > /dev/null
          echo "closed stale self-audit issue #${iid}"
        fi
      done

      rm -f "$HDR"

    # 4. Cost cap 检查（输出警告但不阻断）
    - |
      MONTH=$(date +%Y-%m)
      CAP_FILE=docs/ai-cto/.evolve-cost-month.json
      if [ -f "$CAP_FILE" ]; then
        EXCEEDED=$(jq -r '.exceeded // false' "$CAP_FILE")
        if [ "$EXCEEDED" = "true" ]; then
          echo "WARNING: Cost cap exceeded for $MONTH — /cto-evolve 退化模式"
        fi
      fi

# -----------------------------------------------------------------------------
# canary（原 .github/workflows/canary.yml）—— §45
#
# 触发：push 到 `claude/canary-*` 分支；或 web 手动（带 PERCENT / DURATION_HOURS 变量）。
# /cto-canary 生成的 per-feature 配置放 `.gitlab/ci/canary-<feature>.yml`，
# 由本文件或 MR 里的 `include:` 引入。
# -----------------------------------------------------------------------------
canary:
  stage: canary
  variables:
    PERCENT: '5'
    DURATION_HOURS: '24'
    GIT_DEPTH: '2'
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^claude\/canary-/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - 'docs/ai-cto/INCIDENTS.md'
  script:
    - |
      set -u
      CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
        | grep -E '(CLAUDE\.md|\.claude/commands|\.claude/hooks|\.claude/settings\.json)' || true)
      if [ -z "$CHANGED" ]; then
        echo "无 agent 配置改动 — canary 跳过。"
        exit 0
      fi
      echo "改动的配置："
      echo "$CHANGED"

      echo "--- Run eval gate ---"
      # placeholder — 真实 eval runner 集成见 §47
      ls evals/golden-trajectories/ | wc -l

      echo "--- Record canary state ---"
      mkdir -p docs/ai-cto
      {
        echo ""
        echo "## [PENDING] Canary $(git rev-parse --short HEAD) — $(date -u +%Y-%m-%d)"
        echo "- 状态：观察中"
        echo "- 部署比例：${PERCENT}%"
        echo "- 观察期：${DURATION_HOURS}h"
        echo "- 触发：${CI_COMMIT_REF_NAME}"
      } >> docs/ai-cto/INCIDENTS.md

      echo "Canary started. Observe for ${DURATION_HOURS}h."
      echo "Auto-promote on success, auto-rollback on failure."
