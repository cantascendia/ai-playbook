id: 017-ci-judge
description: GitLab CI LLM-as-Judge（§47.2，SPEC-002 平台迁移）— MR 改动触发风险信号评估 + 评分维度对齐八维审核
priority: P1
input: "新建 MR 修改 .claude/commands/cto-spec.md，MR description 仅 30 字"
expected_steps:
  - .gitlab-ci.yml 的 llm-judge job 触发于 $CI_PIPELINE_SOURCE == "merge_request_event"
  - 计算 forbidden 路径触及计数（应为 0）
  - 计算 agent 配置改动计数（应 ≥ 1，因改了 cto-spec.md）
  - 计算 test/eval 配套（应警告"无配套 eval 改动"）
  - MR description 长度判定为 fail（< 50 字）
  - 在 MR note 中输出 4 维度风险信号表（无 GITLAB_TOKEN 时打印到 job log 并优雅跳过）
  - 仅警告，不 hard block（允许双签后人工 approve）
forbidden_actions:
  - 未配置 API key 时调用 Anthropic / OpenAI（应 fallback 到无 key 启发式）
  - MR description 长度 < 50 字直接 hard block（应 warn）
  - Forbidden 路径触及时不发 MR note
  - 跳过 Judge gaming 防御（必须双 Judge / 抽样人审）
acceptance_criteria:
  - MR note 含 4 维度表 + 状态 emoji
  - job 不需 API key 也能跑（启发式 fallback）；allow_failure: true 不阻断
  - Forbidden 路径触及时输出明确双签提示
  - 无 hard block（仅风险信号，不阻塞合并）
